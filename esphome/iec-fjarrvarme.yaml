# ESPHome configuration for Waveshare ESP32-C3-Zero
# - Landis+Gyr UltraHeat T550 / UH50 District Heating meter.
#   Read with the vendored local 'uh50' component (psvanstrom/esphome-uh50reader,
#   MIT). The UH50 speaks IEC 62056-21 *mode B*: a wake-up + "/#!" request is sent
#   at 300 baud and the meter replies at 2400 baud (7-E-2) — so two UARTs are used.
#   This is why the generic mode-C iec62056 component read nothing.
# - Bluetooth proxy (BLE)
# - Onboard WS2812 RGB LED (GPIO10) as a status indicator:
#   pulsing orange = no WiFi, blue = online/waiting, green = readout OK
#
# Hardware: ESP32-C3-Zero (RISC-V, native USB-C = USB Serial/JTAG for logging;
#           no UART-bridge chip, so the logger must use USB_SERIAL_JTAG).
#
# SmartGateways IR probe wiring (separate optical TX/RX lines).
# NOTE: this probe's Green/Yellow are mislabeled vs the print — the working
# orientation (verified against the Tekniska Verken UH50) is:
#   Probe VCC (Red)    -> 3V3
#   Probe GND (Black)  -> GND
#   Probe (Yellow)     -> GPIO20 (ESP RX, uart_in @2400)  [meter data out]
#   Probe (Green)      -> GPIO21 (ESP TX, uart_out @300)  [request to meter]
#   Valid C3 GPIOs: 0-10 and 18-21 (GPIO18/19 = native USB; 11-17 = flash).

esphome:
  name: iec-fjarrvarme
  friendly_name: IEC Fjärrvärme
  on_boot:
    # Pulsing orange = not yet connected to WiFi (searching). Turns solid blue
    # when WiFi connects, then green on a successful readout.
    priority: -100
    then:
      - light.turn_on:
          id: status_led
          effect: "searching"
          red: 100%
          green: 45%
          blue: 0%
          brightness: 45%

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

logger:
  level: DEBUG
  # C3-Zero has no UART-bridge chip; log over the native USB Serial/JTAG.
  # This also frees both hardware UARTs for the meter (uart_in + uart_out).
  hardware_uart: USB_SERIAL_JTAG
  logs:
    wifi: INFO
    sensor: INFO
    api: INFO
    ota: INFO
    component: INFO
    # The full telegram has ~40 OBIS fields; logging each one at DEBUG blocks
    # loop() long enough to trip the "took a long time" warning. Quiet it.
    OBIS: WARN

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 5min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  on_connect:
    # Solid blue = WiFi connected, waiting for the first meter readout.
    - light.turn_on:
        id: status_led
        effect: "None"
        red: 0%
        green: 0%
        blue: 100%
        brightness: 20%
  on_disconnect:
    # Pulsing orange = WiFi lost.
    - light.turn_on:
        id: status_led
        effect: "searching"
        red: 100%
        green: 45%
        blue: 0%
        brightness: 45%

external_components:
  - source:
      type: local
      path: local_components
    components: [uh50]

# The UH50 sends its request at 300 baud and replies at 2400 baud, so two UARTs
# are used. Both are 7 data bits, EVEN parity, 2 stop bits.
uart:
  - id: uart_in
    rx_pin: GPIO20
    baud_rate: 2400
    data_bits: 7
    parity: EVEN
    stop_bits: 2
    rx_buffer_size: 2048
  - id: uart_out
    tx_pin: GPIO21
    baud_rate: 300
    data_bits: 7
    parity: EVEN
    stop_bits: 2

sensor:
  - platform: uh50
    uart_id: uart_in
    uart_out_id: uart_out
    # The T550/UH50 is battery-powered; production interval should be ~30min.
    # Kept short while verifying the optical link — raise to 30min once it reads.
    update_interval: 60s
    read_button:
      name: "Läs mätare nu"
    cumulative_energy:
      name: "Fjärrvärme Energi Total"
      icon: "mdi:fire"
      # Green = a readout succeeded (only publishes on success).
      on_value:
        - if:
            condition:
              wifi.connected:
            then:
              - light.turn_on:
                  id: status_led
                  effect: "None"
                  red: 0%
                  green: 100%
                  blue: 0%
                  brightness: 25%
    cumulative_volume:
      name: "Fjärrvärme Volym Total"
      icon: "mdi:counter"
    current_power:
      name: "Fjärrvärme Effekt"
      icon: "mdi:flash"
    flow_rate:
      name: "Fjärrvärme Flöde"
      icon: "mdi:water-pump"
    flow_temp:
      name: "Fjärrvärme Tilloppstemperatur"
      icon: "mdi:thermometer-chevron-up"
    return_temp:
      name: "Fjärrvärme Returtemperatur"
      icon: "mdi:thermometer-chevron-down"
    diff_temp:
      name: "Fjärrvärme Temperaturdifferens"
      icon: "mdi:thermometer"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

binary_sensor:
  - platform: status
    name: "Status"

button:
  - platform: restart
    name: "Restart"

# Onboard WS2812 RGB status LED (ESP32-C3-Zero, GPIO10, RGB order).
# Driven by on_boot / wifi on_connect+on_disconnect (orange/blue) and the
# energy sensor on_value (green). Exposed to HA for manual testing.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    entity_category: diagnostic
    pin: GPIO10
    num_leds: 1
    chipset: WS2812
    rgb_order: RGB
    default_transition_length: 150ms
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "searching"
          transition_length: 0.4s
          update_interval: 0.4s
