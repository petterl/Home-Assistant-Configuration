# ESPHome configuration for Waveshare ESP32-C3-Zero
# - Landis+Gyr T550 UltraHeat District Heating (IEC 62056-21 via IR probe)
# - Bluetooth proxy (BLE)
# - Onboard WS2812 RGB LED (GPIO10) as a status indicator:
#   pulsing orange = no WiFi, blue = online/waiting, green = readout OK,
#   red = WiFi up but meter not responding
#
# Hardware: ESP32-C3-Zero (RISC-V, native USB-C = USB Serial/JTAG for logging;
#           no UART-bridge chip, so the logger must use USB_SERIAL_JTAG).
#
# SmartGateways IEC62056-21 IR Probe Wiring:
#   Probe VCC (Red)    -> 3V3
#   Probe GND (Black)  -> GND
#   Probe TX  (Green)  -> GPIO20 (ESP RX)
#   Probe RX  (Yellow) -> GPIO21 (ESP TX)
#   Note: If no data, try swapping Green/Yellow.
#   Valid C3 GPIOs: 0-10 and 18-21 (GPIO18/19 = native USB; 11-17 = flash).

esphome:
  name: iec-fjarrvarme
  friendly_name: IEC Fjärrvärme
  on_boot:
    # Pulsing orange = not yet connected to WiFi (searching). Turns solid blue
    # when WiFi connects, then green on a good readout / red on meter timeout.
    priority: -100
    then:
      - light.turn_on:
          id: status_led
          effect: "searching"
          red: 100%
          green: 45%
          blue: 0%
          brightness: 45%

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

logger:
  level: DEBUG
  # C3-Zero has no UART-bridge chip; log over the native USB Serial/JTAG.
  # This also frees UART0 (GPIO20/21) for the IEC meter UART below.
  hardware_uart: USB_SERIAL_JTAG
  logs:
    wifi: INFO
    sensor: INFO
    api: INFO
    ota: INFO
    component: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 5min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  on_connect:
    # Solid blue = WiFi connected, waiting for the first meter readout.
    - light.turn_on:
        id: status_led
        effect: "None"
        red: 0%
        green: 0%
        blue: 100%
        brightness: 20%
  on_disconnect:
    # Pulsing orange = WiFi lost.
    - light.turn_on:
        id: status_led
        effect: "searching"
        red: 100%
        green: 45%
        blue: 0%
        brightness: 45%

external_components:
  - source:
      type: local
      path: local_components
    components: [iec62056]

# UART for IEC 62056-21 IR probe (Landis+Gyr T550 UltraHeat)
uart:
  id: iec_uart
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 300
  data_bits: 7
  parity: EVEN
  stop_bits: 1

iec62056:
  uart_id: iec_uart
  update_interval: 60s
  baud_rate_max: 9600
  on_timeout:
    # Fires only after all retries fail = meter not responding.
    # Keep the WiFi-down indication visible if WiFi is also down.
    - if:
        condition:
          wifi.connected:
        then:
          - light.turn_on:
              id: status_led
              effect: "None"
              red: 100%
              green: 0%
              blue: 0%
              brightness: 40%

sensor:
  - platform: iec62056
    obis: "6.8"
    name: "Fjärrvärme Energi Total"
    icon: "mdi:fire"
    unit_of_measurement: MWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing
    # Green = a readout succeeded (this value only publishes on success).
    # Only repaint when WiFi is up, so a WiFi outage stays visible.
    on_value:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on:
                id: status_led
                effect: "None"
                red: 0%
                green: 100%
                blue: 0%
                brightness: 25%

  - platform: iec62056
    obis: "6.6"
    name: "Fjärrvärme Effekt"
    icon: "mdi:flash"
    unit_of_measurement: kW
    accuracy_decimals: 2
    device_class: power
    state_class: measurement

  - platform: iec62056
    obis: "9.4"
    name: "Fjärrvärme Tilloppstemperatur"
    icon: "mdi:thermometer-chevron-up"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: iec62056
    obis: "9.4*02"
    name: "Fjärrvärme Returtemperatur"
    icon: "mdi:thermometer-chevron-down"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: iec62056
    obis: "6.33"
    name: "Fjärrvärme Flöde"
    icon: "mdi:water-pump"
    unit_of_measurement: "m³/h"
    accuracy_decimals: 3
    state_class: measurement

  - platform: iec62056
    obis: "6.26"
    name: "Fjärrvärme Volym Total"
    icon: "mdi:counter"
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    state_class: total_increasing

  - platform: iec62056
    obis: "6.31"
    name: "Fjärrvärme Drifttimmar"
    icon: "mdi:clock-outline"
    unit_of_measurement: "h"
    state_class: total_increasing

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

binary_sensor:
  - platform: status
    name: "Status"

button:
  - platform: restart
    name: "Restart"

# Onboard WS2812 RGB status LED (ESP32-C3-Zero, GPIO10, RGB order).
# Driven by on_boot (blue), iec62056 on_timeout (red) and the energy
# sensor on_value (green). Exposed to HA for manual testing.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    entity_category: diagnostic
    pin: GPIO10
    num_leds: 1
    chipset: WS2812
    rgb_order: RGB
    default_transition_length: 150ms
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "searching"
          transition_length: 0.4s
          update_interval: 0.4s
